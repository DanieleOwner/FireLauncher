# Compila FireLauncher e pubblica l'APK come release di GitHub.
# Le Fire TV con la versione pubblicata la vedono in Impostazioni → Aggiornamenti.
#
# Segreti richiesti (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_BASE64   keystore di firma, in base64
#   RELEASE_KEYSTORE_PASSWORD password del keystore
#   RELEASE_KEY_ALIAS         alias della chiave
#   RELEASE_KEY_PASSWORD      password della chiave
# Senza segreti la build viene comunque verificata, ma non pubblicata.

name: Build and release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Version
        run: echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Signing key
        if: env.KEYSTORE_B64 != '' && github.event_name != 'pull_request'
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Build
        env:
          KS_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ARGS="-Pfirelauncher.versionCode=$VERSION_CODE"
          if [ "$SIGNED" = "true" ]; then
            ARGS="$ARGS -Pfirelauncher.ciRelease=true -Pfirelauncher.keystore=$RUNNER_TEMP/release.jks"
            ARGS="$ARGS -Pfirelauncher.keystorePassword=$KS_PASSWORD -Pfirelauncher.keyAlias=$KEY_ALIAS -Pfirelauncher.keyPassword=$KEY_PASSWORD"
          fi
          ./gradlew assembleRelease --no-daemon $ARGS

      - name: Publish release
        if: env.SIGNED == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "FireLauncher-1.0.$VERSION_CODE.apk"
          gh release create "build-$VERSION_CODE" "FireLauncher-1.0.$VERSION_CODE.apk" \
            --title "FireLauncher 1.0.$VERSION_CODE" \
            --notes "Build automatica da ${GITHUB_SHA::7}. Sulla Fire TV: Impostazioni → Aggiornamenti."
